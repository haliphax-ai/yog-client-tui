name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: haliphax-ai/yog-client-tui/.github@main
      - run: npm run typecheck

  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: haliphax-ai/yog-client-tui/.github@main
      - run: npx vitest run --silent=true --coverage --coverage.reporter=lcov
      - name: Upload coverage to Qlty
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: qltysh/qlty-action/coverage@v2
        with:
          oidc: true
          files: coverage/lcov.info

  depcruise:
    runs-on: ubuntu-latest
    steps:
      - uses: haliphax-ai/yog-client-tui/.github@main
      - run: npm run depcruise

  oxlint:
    runs-on: ubuntu-latest
    steps:
      - uses: haliphax-ai/yog-client-tui/.github@main
      - name: oxlint
        run: npx oxlint .

  oxfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: haliphax-ai/yog-client-tui/.github@main
      - name: oxfmt
        run: npx oxfmt --check --no-error-on-unmatched-pattern .
